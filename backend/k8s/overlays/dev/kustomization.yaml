apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: auth-project-api
    newName: auth-project-api
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: auth-project-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
