apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-project-api
  labels:
    app: auth-project-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-project-api
  template:
    metadata:
      labels:
        app: auth-project-api
    spec:
      containers:
        - name: api
          image: auth-project-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-project-api-config
            - secretRef:
                name: auth-project-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
